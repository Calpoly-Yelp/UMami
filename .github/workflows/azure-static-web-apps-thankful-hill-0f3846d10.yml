name: Retire Azure frontend

on:
   workflow_dispatch:
      inputs:
         confirmation:
            description: "Type retire-azure-frontend after approving retirement of the old site"
            required: true
            type: string

permissions:
   contents: read
   actions: read

concurrency:
   group: azure-retirement-production
   cancel-in-progress: false

jobs:
   retire:
      if: github.repository == 'Calpoly-Yelp/UMami' && github.ref == 'refs/heads/main' && inputs.confirmation == 'retire-azure-frontend'
      runs-on: ubuntu-latest
      timeout-minutes: 15
      steps:
         - uses: actions/checkout@v4
           with:
              persist-credentials: false
         - uses: actions/setup-node@v4
           with:
              node-version: 24
         - name: Test and build the keyless artifacts
           run: node --test retirement/retirement.test.mjs
         - name: Require successful CI on the latest main commit
           run: node retirement/deployment-gate.mjs
           env:
              GH_TOKEN: ${{ github.token }}
         - name: Publish only the moved notice
           uses: Azure/static-web-apps-deploy@v1
           with:
              azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_HILL_0F3846D10 }}
              action: upload
              app_location: retirement/dist/frontend
              api_location: ""
              output_location: ""
              skip_app_build: true
              skip_api_build: true
         - name: Verify public retirement responses
           run: node retirement/verify-live.mjs frontend
