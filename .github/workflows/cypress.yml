name: Cypress E2E Tests

on:
   pull_request:
      branches: ["main"]

jobs:
   cypress-run:
      runs-on: ubuntu-latest
      steps:
         - name: Checkout Code
           uses: actions/checkout@v4

         - name: Setup Node.js
           uses: actions/setup-node@v4
           with:
              node-version: "20"

         - name: Install Root Dependencies
           run: npm install

         - name: Install Backend Dependencies
           run: npm install --prefix backend

         - name: Install Frontend Dependencies
           run: npm install --prefix frontend

         - name: Cypress run
           uses: cypress-io/github-action@v6
           with:
              # Start both servers simultaneously using npx concurrently
              start: npx concurrently "npm run dev --prefix backend" "npm run dev --prefix frontend"
              # Wait for both the frontend and backend to be fully booted up before testing
              wait-on: "http://localhost:5173, http://localhost:4000/api/restaurants"
              wait-on-timeout: 120
           env:
              # IMPORTANT: Pass any Supabase environment variables your app needs to run!
              # VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
              # VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
