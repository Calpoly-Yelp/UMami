name: Retirement browser smoke

on:
   pull_request:
      branches: [main]
   push:
      branches: [main]

permissions:
   contents: read

jobs:
   browser:
      runs-on: ubuntu-latest
      timeout-minutes: 15
      steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
              node-version: 24
         - run: npm ci --prefix backend
         - run: backend/node_modules/.bin/playwright install --with-deps chromium
         - run: node retirement/browser-smoke.mjs
