# ci-testing.yml
# GitHub Actions workflow for continuous integration testing of the Supabase Next.js template

# Name of the CI workflow shown in GitHub Actions tab
name: CI Testing

# Triggers: run this workflow on every push to main branch
on:
   push:
      branches: [main]

jobs:
   build:
      # Use the latest Ubuntu virtual machine as the runner
      runs-on: ubuntu-latest

      # Pass Supabase credentials from GitHub Secrets as environment variables
      env:
         SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
         SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      steps:
         # Step 1: Check out the repository code onto the runner
         - uses: actions/checkout@v4

         # Step 2: Set up Node.js version matching local development environment
         - uses: actions/setup-node@v3
           with:
              node-version: 24

         # Step 3: Clean install all root dependencies (equivalent to npm install but stricter)
         - run: npm ci

         # Step 4: Run ESLint and Prettier checks on frontend and backend
         - run: npm run lint

         # Step 5: Run all frontend and backend Jest tests
         - run: npm test

         # Step 6: Build the Next.js application to ensure it compiles successfully
