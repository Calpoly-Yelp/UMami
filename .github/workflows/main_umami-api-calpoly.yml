# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
name: Build and deploy Node.js app to Azure Web App - umami-api-calpoly

on:
   push:
      branches:
         - main
   workflow_dispatch:

jobs:
   build:
      runs-on: windows-latest

      permissions:
         contents: read

      env:
         SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
         SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      steps:
         - uses: actions/checkout@v4

         - name: Set up Node.js version
           uses: actions/setup-node@v3
           with:
              node-version: "22.x"

         - name: npm install, build, and test
           run: |
              npm install
              npm install --prefix backend
              npm run backend:test --if-present

         - name: Zip artifact for deployment
           run: Compress-Archive -Path * -DestinationPath release.zip
           working-directory: backend

         - name: Upload artifact for deployment job
           uses: actions/upload-artifact@v4
           with:
              name: node-app
              path: backend/release.zip

   deploy:
      runs-on: ubuntu-latest
      needs: build
      permissions:
         id-token: write
         contents: read

      steps:
         - name: Download artifact from build job
           uses: actions/download-artifact@v4
           with:
              name: node-app

         - name: Login to Azure
           uses: azure/login@v2
           with:
              client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E611DAC2DD1C4619A5F8AD6C69D6CC3B }}
              tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DB303E989A9046D795528D22D9CA06A1 }}
              subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_473E126DBB974F5997978B6ECFCB5A25 }}

         - name: Deploy to Azure Web App
           uses: azure/webapps-deploy@v3
           id: deploy-to-webapp
           with:
              app-name: "umami-api-calpoly"
              slot-name: "Production"
              package: release.zip
