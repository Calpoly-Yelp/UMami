name: Retire Azure API

on:
   workflow_dispatch:
      inputs:
         confirmation:
            description: "Type retire-azure-api after approving retirement of the old API"
            required: true
            type: string

permissions:
   contents: read
   actions: read

concurrency:
   group: azure-retirement-production
   cancel-in-progress: false

jobs:
   retire:
      if: github.repository == 'Calpoly-Yelp/UMami' && github.ref == 'refs/heads/main' && inputs.confirmation == 'retire-azure-api'
      runs-on: ubuntu-latest
      timeout-minutes: 15
      permissions:
         contents: read
         actions: read
         id-token: write
      steps:
         - uses: actions/checkout@v4
           with:
              persist-credentials: false
         - uses: actions/setup-node@v4
           with:
              node-version: 24
         - name: Test and build the keyless artifacts
           run: node --test retirement/retirement.test.mjs
         - name: Package only the retirement server
           working-directory: retirement/dist/api
           run: zip ../release.zip index.js package.json
         - name: Require the latest main commit
           run: node retirement/deployment-gate.mjs
           env:
              GH_TOKEN: ${{ github.token }}
         - name: Login to Azure with existing deployment identity
           uses: azure/login@v2
           with:
              client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3AD7C2260C89409F88488C24ACF37F34 }}
              tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A9E5366121584B0BB1DD9DDF90BD80A4 }}
              subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_434CAE293CF8444FA6483DBFC212C331 }}
         - name: Require the latest main commit immediately before deployment
           run: node retirement/deployment-gate.mjs
           env:
              GH_TOKEN: ${{ github.token }}
         - name: Publish the keyless retirement server
           uses: azure/webapps-deploy@v3
           with:
              app-name: umami-api-calpoly
              slot-name: Production
              package: retirement/dist/release.zip
              startup-command: "node /home/site/wwwroot/index.js"
         - name: Verify public retirement responses
           run: node retirement/verify-live.mjs api
